{% extends 'shop/base.html' %}

{% block content %}
    <h1>All Perfumes</h1>
    <div class="row">
        {% for perfume in perfumes %}
            <div class="col-md-4">
                <div class="card mb-4">
                    <img src="{{ perfume.image.url }}" class="card-img-top" alt="{{ perfume.name }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ perfume.name }}</h5>
                        <p class="card-text"><strong>Brand:</strong> {{ perfume.brand }}</p>
                        <p class="card-text"><strong>Price:</strong> ${{ perfume.price }}</p>
                        <a href="{% url 'product_detail' perfume.pk %}" class="btn btn-primary">View Details</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>No perfumes available.</p>
        {% endfor %}
    </div>
    <a href="{% url 'home' %}">Back to Home</a>
{% endblock %}
